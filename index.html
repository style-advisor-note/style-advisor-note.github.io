<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF5F8" id="themeColor">
<script>
  // 画面の色（ライト／ダーク／端末に合わせる）を、描く前に決める
  (function () {
    var t = "light";
    try { t = (JSON.parse(localStorage.getItem("ba_settings") || "{}").theme) || "light"; } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>スタイルノート</title>
<meta name="apple-mobile-web-app-title" content="スタイルノート">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #FCF5F8; --bg2: #F3EEFA; --surface: #FFFFFF; --surface2: #FAF1F5; --text: #231F35; --muted: #7D7390; --line: #EFE3EA;
  --accent: #1E2150; --on-accent: #FFFFFF; --rose: #C8336F; --blush: #F7DDE7; --lilac: #E7E0F5; --mint: #DDF1EE;
  --skin: #FBE7E0; --hair: #2B2A4A;
  --good: #1E5E52; --good-bg: #DDF3EE; --ok: #2D3E7A; --ok-bg: #E4E8FA; --warn: #85500A; --warn-bg: #FCEBD0; --bad: #9B1B4B; --bad-bg: #FBDDE8;
  --shadow: 0 8px 24px rgba(120, 60, 100, .08), 0 1px 3px rgba(120, 60, 100, .06);
  --sans: "Meiryo", "メイリオ", "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
  --serif: var(--sans);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    color-scheme: dark;
    --bg: #16141F; --bg2: #1D1929; --surface: #221E2F; --surface2: #2A2539; --text: #F1ECF4; --muted: #ADA3BD; --line: #362F47;
    --accent: #E7DDF7; --on-accent: #1E2150; --rose: #F28DB4; --blush: #43293A; --lilac: #332C4B; --mint: #1E3A36;
    --skin: #F3D9D0; --hair: #0F0E1A;
    --good: #9FE3D4; --good-bg: #173A33; --ok: #C3CEF6; --ok-bg: #252C4E; --warn: #F5CF8E; --warn-bg: #3E2E12; --bad: #F7A9C6; --bad-bg: #47192C;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16141F; --bg2: #1D1929; --surface: #221E2F; --surface2: #2A2539; --text: #F1ECF4; --muted: #ADA3BD; --line: #362F47;
    --accent: #E7DDF7; --on-accent: #1E2150; --rose: #F28DB4; --blush: #43293A; --lilac: #332C4B; --mint: #1E3A36;
    --skin: #F3D9D0; --hair: #0F0E1A;
    --good: #9FE3D4; --good-bg: #173A33; --ok: #C3CEF6; --ok-bg: #252C4E; --warn: #F5CF8E; --warn-bg: #3E2E12; --bad: #F7A9C6; --bad-bg: #47192C;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed; color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.7; }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(100px + env(safe-area-inset-bottom)); }
h1, h2, h3, .serif { font-family: var(--serif); font-weight: 600; letter-spacing: .02em; }
h1 { font-size: 22px; margin: 8px 0 14px; }
h2 { font-size: 18px; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .ic { color: var(--rose); }
h3 { font-size: 15px; margin: 14px 0 6px; }
p { margin: 6px 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.view { display: none; animation: fade .25s ease; }
.view.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }
.ic { width: 22px; height: 22px; flex: none; }
.card { background: var(--surface); border-radius: 22px; padding: 18px; margin: 12px 0; box-shadow: var(--shadow); }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 14px; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 20px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; border-radius: 8px; }

/* ---- 早見表 ---- */
.hero { position: relative; border-radius: 28px; padding: 20px 18px 18px; background: linear-gradient(140deg, var(--blush) 0%, var(--lilac) 100%); overflow: hidden; box-shadow: var(--shadow); }
.hero svg.art { display: block; width: 220px; height: 180px; margin: -8px auto 2px; }
.hero .kicker { text-align: center; font-size: 12px; letter-spacing: .2em; color: var(--muted); }
.hero .title { text-align: center; font-family: var(--serif); font-size: 20px; margin: 2px 0 10px; }
.hero .quote { font-family: var(--serif); font-size: 16px; line-height: 1.8; text-align: center; margin: 0; }
.types { background: var(--surface); border-radius: 22px; padding: 6px 16px; margin-top: 14px; box-shadow: var(--shadow); }
.type { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.type:last-child { border-bottom: none; }
.type .bub { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.type small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
.type b { display: block; font-family: var(--serif); font-size: 16px; line-height: 1.4; }
.type em { display: block; font-style: normal; font-size: 12px; color: var(--muted); font-family: var(--sans); font-weight: 400; }
.palette { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.dot { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line), 0 3px 8px rgba(0,0,0,.08); padding: 0; transition: transform .15s; }
.dot[aria-pressed="true"] { transform: scale(1.15); box-shadow: 0 0 0 2px var(--rose), 0 4px 10px rgba(0,0,0,.12); }
.swInfo { text-align: center; min-height: 48px; margin-top: 12px; font-size: 14px; }
.swInfo b { font-family: var(--serif); }
.avoid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.avoid span { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 10px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.tile .bub { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 8px; }
.tile b { display: block; font-size: 13px; }
.tile span { display: block; font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 16px 16px; margin: 0 -16px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.rcard { flex: 0 0 72%; scroll-snap-align: center; background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); position: relative; }
.rcard .no { font-family: var(--serif); font-size: 34px; line-height: 1; color: var(--rose); opacity: .85; }
.rcard b { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; }
.rcard p { font-family: var(--serif); font-size: 16px; margin: 4px 0 0; line-height: 1.6; }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: -6px; }
details.fold { background: var(--surface); border-radius: 18px; margin: 8px 0; box-shadow: var(--shadow); }
details.fold > summary { padding: 14px 16px; list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .bub { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; }
details.fold > summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
details.fold[open] > summary .chev { transform: rotate(180deg); }
details.fold > .md { padding: 0 16px 14px; }
.b-rose { background: var(--blush); color: var(--rose); }
.b-lilac { background: var(--lilac); color: var(--accent); }
.b-mint { background: var(--mint); color: var(--good); }

/* ---- md ---- */
.md { font-size: 14px; }
.md table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.md th { color: var(--muted); font-weight: 600; white-space: nowrap; }
.md ul, .md ol { padding-left: 1.2em; margin: 6px 0; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--rose); }
.md blockquote { margin: 8px 0; padding: 10px 14px; background: var(--surface2); border-radius: 14px; font-family: var(--serif); }
.md code { font-size: 12px; background: var(--surface2); padding: 1px 5px; border-radius: 6px; }
.md h4 { font-family: var(--serif); margin: 14px 0 4px; }

/* ---- メイク ---- */
.stepNav { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; margin: 0 -16px; scrollbar-width: none; }
.stepNav::-webkit-scrollbar { display: none; }
.stepNav button { flex: none; width: 52px; border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.stepNav button .bub { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--muted); }
.stepNav button[aria-current="step"] { color: var(--text); font-weight: 700; }
.stepNav button[aria-current="step"] .bub { background: var(--accent); color: var(--on-accent); }
.stepCard { text-align: center; padding: 22px 18px; }
.stepCard .big { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center; background: linear-gradient(140deg, var(--blush), var(--lilac)); color: var(--accent); }
.stepCard .big .ic { width: 48px; height: 48px; }
.stepCard .no { font-size: 12px; letter-spacing: .15em; color: var(--rose); font-weight: 700; }
.stepCard h2 { justify-content: center; margin: 2px 0 6px; font-size: 22px; }
.stepCard .one { font-family: var(--serif); font-size: 16px; line-height: 1.7; margin: 0 0 12px; }
.point { text-align: left; background: var(--surface2); border-radius: 16px; padding: 12px 14px; margin: 8px 0; font-size: 14px; }
.point b { display: inline-block; font-size: 12px; color: var(--rose); margin-right: 6px; }
details.more { text-align: left; margin-top: 10px; }
details.more > summary { list-style: none; cursor: pointer; text-align: center; color: var(--muted); font-size: 13px; padding: 6px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { display: none; }
.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 0 0 8px; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--accent)); transition: width .3s; }
.pager { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); display: flex; gap: 10px; padding: 10px 0 4px; }
.pager .btn { flex: 1; box-shadow: var(--shadow); }
.mottos { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 6px; margin: 0 -16px 6px; scrollbar-width: none; }
.mottos::-webkit-scrollbar { display: none; }
.mottos span { flex: none; font-family: var(--serif); font-size: 13px; background: var(--surface); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow); }
.cksec { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font-weight: 700; font-size: 14px; }
.ckgrid { display: flex; flex-wrap: wrap; gap: 8px; }
.ck { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 12px; font-size: 13px; text-align: left; display: inline-flex; gap: 6px; align-items: center; }
.ck .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--muted); display: grid; place-items: center; flex: none; }
.ck[aria-pressed="true"] { background: var(--mint); border-color: transparent; color: var(--good); }
.ck[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: var(--mint); }
.ck .box .ic { width: 14px; height: 14px; opacity: 0; }
.ck[aria-pressed="true"] .box .ic { opacity: 1; }

/* ---- 判定 ---- */
.seg { display: flex; background: var(--surface); border-radius: 999px; padding: 5px; gap: 4px; box-shadow: var(--shadow); }
.seg button { flex: 1; border: none; background: none; border-radius: 999px; padding: 8px; min-height: 42px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin: 14px 0; }
.mode { border: 2px solid transparent; background: var(--surface); border-radius: 20px; padding: 12px 6px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.mode .bub { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
.mode .bub .ic { width: 26px; height: 26px; }
.mode[aria-pressed="true"] { border-color: var(--rose); }
.drop { border: 2px dashed var(--line); border-radius: 20px; padding: 16px; text-align: center; background: var(--surface2); }
.drop .ic { width: 34px; height: 34px; color: var(--rose); }
.drop p { margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
.photos { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; justify-content: center; }
.photo { position: relative; width: 92px; height: 92px; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface2); }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; line-height: 1; }
.slotTitle { font-weight: 700; font-size: 14px; margin: 14px 0 6px; display: flex; justify-content: space-between; }
textarea, input[type=text], input[type=password], select { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 14px; min-height: 46px; }
textarea { min-height: 64px; resize: vertical; }
.toggle { display: flex; gap: 10px; align-items: center; padding: 10px 0; font-size: 14px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--rose); }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 16px; padding: 12px 14px; font-size: 13px; margin: 8px 0; }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 16px; padding: 12px 14px; font-size: 13px; margin: 8px 0; }
.loading { display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--muted); padding: 16px 0; font-size: 13px; }
.loading .ic { width: 36px; height: 36px; color: var(--rose); animation: twinkle 1.4s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(.8) rotate(20deg); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .loading .ic { animation: none; } }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.cat { border: 2px solid transparent; background: var(--surface); border-radius: 16px; padding: 10px 2px 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; }
.cat .ic { width: 26px; height: 26px; color: var(--accent); }
.cat[aria-pressed="true"] { border-color: var(--rose); }
.attr { margin: 14px 0; }
.attr > b { display: block; font-size: 13px; margin-bottom: 6px; }
.attr > b span { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; min-height: 38px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip .sw { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.12); flex: none; }
.chip .g { font-size: 11px; opacity: .75; }

/* ---- 結果 ---- */
.grade { display: inline-flex; align-items: center; justify-content: center; min-width: 2em; padding: 0 7px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.g-◎ { background: var(--good-bg); color: var(--good); }
.g-○ { background: var(--ok-bg); color: var(--ok); }
.g-△ { background: var(--warn-bg); color: var(--warn); }
.g-× { background: var(--bad-bg); color: var(--bad); }
.g-？ { background: var(--surface2); color: var(--muted); }
.verdict { display: flex; gap: 14px; align-items: center; }
.medal { width: 76px; height: 76px; border-radius: 50%; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.medal big { font-size: 30px; font-weight: 700; }
.medal small { font-size: 10px; font-weight: 700; }
.verdict p { font-family: var(--serif); font-size: 16px; margin: 0; line-height: 1.6; }
.rs { margin-top: 14px; }
.rs h3 { display: flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 13px; color: var(--muted); }
.rs h3 .ic { width: 18px; height: 18px; }
.item { background: var(--surface2); border-radius: 14px; padding: 10px 12px; margin: 6px 0; font-size: 14px; }
.item .rule { display: block; font-size: 12px; color: var(--muted); }
.item .fix { display: block; margin-top: 4px; color: var(--rose); font-weight: 600; font-size: 13px; }
.item .fix::before { content: "→ "; }
.advice { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; background: var(--blush); color: var(--text); border-radius: 16px; padding: 12px 14px; font-weight: 600; font-size: 14px; }
.advice .ic { color: var(--rose); margin-top: 1px; }
.qa { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 14px; }
.hist { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: none; background: none; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hist img, .hist .ph { width: 52px; height: 52px; object-fit: cover; border-radius: 14px; flex: none; background: var(--surface2); }
.hist .t { flex: 1; min-width: 0; }
.hist .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 14px; }
.empty { text-align: center; padding: 8px 0; }
.empty svg { width: 120px; height: 100px; }

/* ---- 下のメニュー ---- */
nav.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto; background: var(--surface); border-radius: 26px; box-shadow: 0 10px 30px rgba(80, 40, 80, .16); display: flex; padding: 6px; z-index: 10; }
nav.tabs button { flex: 1; border: none; background: none; border-radius: 20px; padding: 7px 0 5px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; }
nav.tabs button[aria-current="page"] { background: var(--blush); color: var(--rose); font-weight: 700; }
</style>
</head>

<main>
  <div id="update" hidden></div>
  <section id="v-quick" class="view on" aria-label="早見表"><div id="quick"></div></section>
  <section id="v-makeup" class="view" aria-label="メイク"><div id="makeup"></div></section>
  <section id="v-judge" class="view" aria-label="判定"><div id="judge"></div></section>
  <section id="v-settings" class="view" aria-label="設定"><div id="settings"></div></section>
</main>
<nav class="tabs" aria-label="メニュー" id="tabs"></nav>

<script type="module">
// ================= 設定値 =================
const APP_VERSION = "2026-09-21.13"; // index.html を直したら上げる（新しい版の知らせに使う）
const API_URL = "https://api.anthropic.com/v1/messages";
const API_BETAS = ["server-side-fallback-2026-07-01"];
const MODELS = {
  "claude-opus-5": { label: "Claude Opus 5（標準）", inPrice: 5, outPrice: 25 },
  "claude-sonnet-5": { label: "Claude Sonnet 5（安め）", inPrice: 2, outPrice: 10 },
};
const YEN_PER_USD = 150;
const HISTORY_MAX = 30;
const MODES = [

  ["ローズ", "#C8577A"], ["レッド", "#C62D3A"], ["ワイン", "#7A2336"], ["ボルドー", "#5E1E2B"],

const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbToHex = c => "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("").toUpperCase();
function toLab([r, g, b]) {
  const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const [R, G, B] = [lin(r), lin(g), lin(b)];
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const x = f((R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047), y = f(R * 0.2126 + G * 0.7152 + B * 0.0722), z = f((R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
const deltaE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
function describeColor(hex) {
  const lab = toLab(hexToRgb(hex));
  const name = COLOR_NAMES.map(([n, h]) => [n, deltaE(lab, toLab(hexToRgb(h)))]).sort((a, b) => a[1] - b[1])[0][0];
  const near = (profile?.colors || []).map(c => [c, deltaE(lab, toLab(hexToRgb(c.hex)))]).sort((a, b) => a[1] - b[1])[0];
  const chroma = Math.hypot(lab[1], lab[2]);
  const traits = [lab[0] > 70 ? "明るい" : lab[0] < 35 ? "暗い" : "中くらいの明るさ", chroma < 12 ? "くすみ・グレー寄り" : chroma > 40 ? "鮮やか" : "やや落ち着いた", lab[2] > 25 && lab[2] > Math.abs(lab[1]) ? "黄み寄り" : lab[2] < -8 ? "青み寄り" : ""].filter(Boolean);
  return { hex, name, traits, near: near && near[1] < 15 ? near[0] : null, nearDist: near ? Math.round(near[1]) : null };
}

const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open("ba", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("history", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("history", mode);
      const out = fn(t.objectStore("history"));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  async all() { try { const r = await this.tx("readonly", s => s.getAll()); return (r || []).sort((a, b) => b.at - a.at); } catch { return []; } },
  async put(item) {
    try {
      await this.tx("readwrite", s => s.put(item));
      const all = await this.all();
      for (const old of all.slice(HISTORY_MAX)) await this.tx("readwrite", s => s.delete(old.id));
    } catch {}
  },
  async clear() { try { await this.tx("readwrite", s => s.clear()); } catch {} },
};

const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const grade = g => `<span class="grade g-${esc(g)}" aria-label="評価 ${esc(g)}">${esc(g)}</span>`;
const medal = g => `<div class="medal g-${esc(g)}" aria-label="評価 ${esc(g)} ${esc(GRADE_WORD[g] || "")}"><big>${esc(g)}</big><small>${esc(GRADE_WORD[g] || "")}</small></div>`;

// md をHTMLにする（見出し・表・入れ子の箇条書き・引用）
function md(text) {
  const lines = String(text || "").split("\n");
  let html = "", i = 0;
  const listStack = [];
  const closeLists = (to = 0) => { while (listStack.length > to) html += `</li></${listStack.pop().tag}>`; };
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith("```")) {
      closeLists(); let code = ""; i++;
      while (i < lines.length && !lines[i].startsWith("```")) code += lines[i++] + "\n";
      html += `<pre><code>${esc(code)}</code></pre>`; i++; continue;
    }
    const h = line.match(/^(#{1,4}) (.+)/);
    if (h) { closeLists(); html += `<h4>${inline(h[2])}</h4>`; i++; continue; }
    if (/^\s*\|/.test(line)) {
      closeLists();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++].trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      const body = rows.filter((r, k) => k > 0 && !r.every(c => /^:?-+:?$/.test(c)));
      html += `<table><thead><tr>${rows[0].map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      continue;
    }
    const li = line.match(/^(\s*)([-*]|\d+\.) (.*)/);
    if (li) {
      const depth = Math.floor(li[1].length / 2) + 1;
      const tag = /\d/.test(li[2]) ? "ol" : "ul";
      if (depth > listStack.length) { while (listStack.length < depth) { html += `<${tag}><li>`; listStack.push({ tag }); } }
      else { closeLists(depth); html += `</li><li>`; }
      html += inline(li[3]); i++; continue;
    }
    if (line.startsWith("> ")) { closeLists(); html += `<blockquote>${inline(line.slice(2))}</blockquote>`; i++; continue; }
    if (!line.trim()) { closeLists(); i++; continue; }
    if (listStack.length && /^\s+/.test(line)) { html += " " + inline(line.trim()); i++; continue; }
    closeLists();
    html += `<p>${inline(line)}</p>`; i++;
  }
  closeLists();
  return `<div class="md">${html}</div>`;
}
// 「- **目的**: …」の形の箇条書きを、1項目ずつに分ける（入れ子の行はその項目に含める）
function blocks(text) {
  const out = [];
  for (const line of String(text || "").split("\n")) {
    const m = line.match(/^- \*\*(.+?)\*\*[:：]?\s*(.*)$/);
    if (m) out.push({ label: m[1], text: m[2], rest: [] });
    else if (out.length && line.trim()) out[out.length - 1].rest.push(line);
    else if (!out.length && line.trim()) out.push({ label: "", text: line.replace(/^\*\*(.+?)\*\*[:：]?\s*/, "$1: "), rest: [] });
  }
  return out;
}

function makeupPages() {
  const pages = [];
  for (const s of profile.makeup.steps) {

    s.subs.forEach((sub, k) => pages.push({ step: s.no, sub: `${s.no}-${k + 1}`, title: sub.title, short: `${s.title} ${k + 1}/${s.subs.length}`, md: sub.md }));

function stepBody(p) {
  const bs = blocks(p.md);
  const first = bs.slice(0, 2), rest = bs.slice(2);
  const show = b => `<div class="point">${b.label ? `<b>${esc(b.label)}</b>` : ""}${inline(b.text)}${b.rest.length ? md(b.rest.map(l => l.replace(/^ {2}/, "")).join("\n")) : ""}</div>`;

}

    <details class="fold"><summary><span class="bub b-rose">${icon("heart")}</span>なりたいイメージと考え方${icon("chev", "chev")}</summary>${md(m.introMd)}</details>`;
  const go = n => { mkPage = Math.max(0, Math.min(pages.length - 1, n)); renderMakeup(); window.scrollTo(0, 0); };
  $("#mkPrev").onclick = () => go(mkPage - 1);
  $("#mkNext").onclick = () => go(mkPage + 1);

  const cur = el.querySelector(".stepNav [aria-current=step]");
  if (cur) cur.parentElement.scrollLeft = cur.offsetLeft - cur.parentElement.clientWidth / 2 + cur.clientWidth / 2;
  let sx = null;
  const card = $("#mkCard");
  card.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  card.addEventListener("touchend", e => {
    if (sx == null) return;

// ---- ルール判定 ----
function ruleResult() {
  const { cat, sel } = judgeState.rule;
  const attrs = profile.judge.attributes.filter(a => a.appliesTo.includes(cat));
  const picked = attrs.filter(a => sel[a.id]).map(a => ({ a, o: a.options.find(o => o.id === sel[a.id]) }));
  const over = {}, notes = [];
  for (const c of profile.judge.combos) {
    if (Object.entries(c.when).every(([k, v]) => sel[k] === v && attrs.some(a => a.id === k))) { Object.assign(over, c.set); notes.push(c.note); }
  }
  const items = picked.map(({ a, o }) => ({ a, o, g: over[a.id] || o.grade }));
  const overall = items.length ? items.reduce((m, x) => GRADE_ORDER[x.g] < GRADE_ORDER[m] ? x.g : m, "◎") : null;
  return { attrs, items, overall, notes };
}

  $("#shop")?.addEventListener("change", e => judgeState.shopping = e.target.checked);

  bindConversation(body);
}

function bindPicker(root) {
  $("#pkOpen", root)?.addEventListener("click", () => { judgeState.picker = { photo: 0, target: "color" }; renderAi(); });
  $("#pkClose", root)?.addEventListener("click", () => { judgeState.picker = null; renderAi(); });
  $("#pkClear", root)?.addEventListener("click", () => { judgeState.picked = null; judgeState.white = null; renderAi(); });
  root.querySelectorAll("[data-pk-photo]").forEach(b => b.onclick = () => { judgeState.picker.photo = +b.dataset.pkPhoto; renderAi(); });
  root.querySelectorAll("[data-pk-target]").forEach(b => b.onclick = () => { judgeState.picker.target = b.dataset.pkTarget; renderAi(); });
  const cv = $("#pickCanvas", root); if (!cv) return;
  const img = new Image();
  img.onload = () => {
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    cv.onclick = e => {
      const r = cv.getBoundingClientRect();
      const x = Math.round((e.clientX - r.left) * cv.width / r.width), y = Math.round((e.clientY - r.top) * cv.height / r.height);
      const n = 4, d = ctx.getImageData(Math.max(0, x - n), Math.max(0, y - n), n * 2 + 1, n * 2 + 1).data;
      const sum = [0, 0, 0]; let cnt = 0;
      for (let i = 0; i < d.length; i += 4) { sum[0] += d[i]; sum[1] += d[i + 1]; sum[2] += d[i + 2]; cnt++; }
      const avg = sum.map(v => v / cnt);
      if (judgeState.picker.target === "white") { judgeState.white = avg; judgeState.picker.target = "color"; } else judgeState.picked = avg;
      const y0 = window.scrollY; renderAi(); window.scrollTo(0, y0);
    };
  };
  img.src = judgeState.photos[0][judgeState.picker.photo].full;
}

async function addPhotos(slot, files) {
  const mode = MODES.find(m => m.id === judgeState.mode);
  const list = judgeState.photos[slot] || (judgeState.photos[slot] = []);
  judgeState.error = "";
  for (const f of files) {
    if (list.length >= mode.slots[slot].max) break;
    try { list.push({ full: await resize(f, 1280, 0.85), thumb: await resize(f, 400, 0.75) }); }
    catch { judgeState.error = "写真を読み込めませんでした。別の写真で試してください。"; }
  }
  renderAi();
}
async function resize(file, maxSide, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", quality);
  } finally { URL.revokeObjectURL(url); }
}

const SYSTEM_BASE = `あなたは、この人専属のスタイリスト兼ビューティーアドバイザーです。
あとに続く「本人の診断ルール」（骨格・顔タイプ・パーソナルカラー）と「本人のメイクレッスン」を踏まえて、写真の服・小物・コスメ・コーデ・メイクについて、プロとして総合的に判断し、提案します。

考え方:
- 診断ルールは「似合いやすい傾向」であって、守らなければいけない決まりではない。ルールの照合ではなく、実際に身につけたときにどう見えるかで判断する
- 次の3つの軸を分けて考え、最後に総合する。軸の重み・色のカギ・本人の診断の核は、診断ルールの「AI判定での考え方」に従う:
  1. 顔タイプ（テイスト）
  2. 骨格（形と重さだけ）: サイズ感・シルエット・丈・ウエスト位置・生地の厚みと重さ
  3. 色: 顔に近いほど重く見る。色の名前より、その色が診断ルールの「色のカギ」に合うかで判断する
- 骨格は「形と重さ」の得意・不得意を表すだけで、テイストとは関係ない。骨格の種類でカジュアル向きかどうかを決めない。テイストは顔タイプで判断する
- 形や生地の厚みが骨格に合っていても、テイストが顔タイプに合わないなら△以下にする
- テイストが合わないアイテムも、合わせ方で補えるなら、何を足せば○になるかを具体的に答える
- ワンピースやセットアップのように1枚でコーデが決まるアイテムは、全身のテイストとして判断する
- 弱い点があっても、ほかの良い点や合わせ方で補えるなら、それも評価する
- 顔から近いほど色の影響は大きい。トップス・襟元・ストール・アクセ・リップ・チークは色のルールを重く見て、ボトムス・靴・バッグは色の自由度が高いと考える
- 色は、診断ルールの色見本と得意な色から、そのアイテムと本人に合う色を幅広く考える。毎回同じ色や同じ提案をくり返さない
- 評価の目安: ◎＝テイスト・形・色がそろって、本人の魅力が引き立つときだけ／○＝問題なく使える／△＝合わせ方の工夫が必要（テイストがずれているときもここ）／×＝顔まわりで明らかに損をするとき。色の小さなずれは、○＋ひと工夫で答える

答え方:
- rule には、判断の決め手になった診断の観点を短く書く（例:「骨格: 丈のバランスが合う」）
- mismatches の fix には、具体的な合わせ方を書く。アイテム名・色名を入れる
- advice には、いちばん効く「次の一手」を1文で書く
- idea には、ルールから少し外れてもおしゃれに楽しめる取り入れ方を1文で書く（例:「あえて黒を主役にして、パールと明るいリップで柔らかさを足す」）。遊び心を大事に
- 中学生でも分かる日本語で、短く書く。各項目は1文・40字くらいまで。専門用語には一言説明を添える
- matches と mismatches は、大事なものから最大2つずつ。unknowns は判定が変わるほど大事なものだけ最大1つ（なければ空）
- 顔や体型そのものの良し悪しは評価しない。見るのは、服・色・メイクの選び方と合わせ方だけ
- headline は結論をひと言で。続けて質問されたときは、headline で質問に直接答える

色と情報の読み方:
- 判定の前に、observed に「写真から見えた色・質感・形」を、ルールと比べずにそのまま短く書く（例:「グレーがかったベージュ。マット」）。似合う色の名前に寄せて読まない
- 室内の照明で黄色っぽく写っているなど、色がずれていそうなときは observed にそう書く。白い紙や白い壁が写っていれば、それを白の基準にして色を読む
- 色の情報の優先順位: 「本人が写真をタップして取った色」＞「調べた商品情報」＞「本人が伝えた色味」＞ 写真の見え方。タップで取った色があるときは、写真の見え方で別の色名に言いかえない
- 本人が伝えた情報（生地の厚み・サイズ感など）は、写真より優先して事実として扱う
- 写真が遠い・暗いなどで見えにくくても、見える範囲で判断する
- 「調べた商品情報」があるときは、色・質感・素材はそれを優先し、写真は形や組み合わせの確認に使う。写真がなく商品情報だけのときは、商品情報から判断する。商品を特定できなかったときは、分かる範囲で判断し、unknowns に「商品を特定できなかった」と書く

判定の種類ごと:
- 服・小物: 上の考え方で判断する。checklist は null
- 全身コーデ: 上の考え方に加えて、配色のコントラスト（明るい色と濃い色・鮮やかな色の差、メリハリ）を必ず確認し、その評価を matches か mismatches に必ず1つ入れる。全身が同じような明るさ・くすんだ色どうしでぼやけているなら mismatches に入れ、どこで差をつけるかを fix に書く。ただし、診断ルールの「コーデ全体の判定ルール」にも合わせる。checklist は null
- コスメ: 色と質感を中心に判断し、メイクレッスンのどのステップでどう使うかも一言添える。checklist は null
- メイク後: メイクレッスンの「仕上がりチェック」の各項目を checklist で返す（写真で判断できる項目だけ）。overall は全体の出来
- 「買うか迷っている」とき: shopping に、手持ちと3コーデ組めそうか（手持ちの情報はないので、合わせやすいアイテムの例で）と、買う前に確かめたいことを入れる。それ以外は shopping を null`;

// Claude API は fetch で直接呼ぶ（外から読み込むライブラリを使わない。セキュリティルール S-61）
class ApiError extends Error {
  constructor(status, body) { super(body?.error?.message || `HTTP ${status}`); this.status = status; this.body = body; }
}
class ConnectionError extends Error {}
const wait = ms => new Promise(r => setTimeout(r, ms));
// やり直すまでの待ち時間。サーバーの指定（retry-after）があれば従い、なければ 0.5秒→1秒 と延ばす
function retryDelay(attempt, headers) {
  const sec = parseFloat(headers?.get("retry-after") ?? "");
  if (sec > 0 && sec <= 60) return sec * 1000;
  return Math.min(500 * 2 ** attempt, 8000) * (1 - Math.random() * 0.25);
}
// SDK と同じく、408・409・429・500番台と通信エラーは2回までやり直す。待ちは1回10分まで
async function createMessage(params) {
  const key = store.get("ba_apiKey");
  if (!key) throw new Error("APIキーが設定されていません");
  for (let attempt = 0; ; attempt++) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-beta": API_BETAS.join(","),
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify(params),
        signal: AbortSignal.timeout(10 * 60 * 1000),
      });
    } catch {
      if (attempt < 2) { await wait(retryDelay(attempt)); continue; }
      throw new ConnectionError("通信できませんでした");
    }
    if (res.ok) return res.json();
    const hint = res.headers.get("x-should-retry");
    const retryable = hint === "true" || (hint !== "false" && (res.status === 408 || res.status === 409 || res.status === 429 || res.status >= 500));
    if (retryable && attempt < 2) { await wait(retryDelay(attempt, res.headers)); continue; }
    let body = null;
    try { body = await res.json(); } catch {}
    throw new ApiError(res.status, body);
  }
}
function errorText(e) {
  if (e instanceof ApiError) {
    if (e.status === 401) return "APIキーが正しくありません。設定で入れ直してください。";
    if (e.status === 403) return "このAPIキーでは使えません（権限がありません）。";
    if (e.status === 429) return "混み合っているか、利用上限に達しました。少し待ってから試してください。";
    if (e.status === 400) return "送った内容でエラーになりました: " + (e.body?.error?.message || e.message);
    return `AI側でエラーになりました（${e.status}）。少し待ってから試してください。`;
  }
  if (e instanceof ConnectionError) return "通信できませんでした。電波のよい場所で試してください。";
  return e?.message || "うまくいきませんでした";
}

  const all = store.get("ba_usage", {});
  const m = all[month] || { count: 0, usd: 0 };
  m.count++; m.usd += usd; all[month] = m;
  store.set("ba_usage", all);
}
const SEARCH_SYSTEM = `あなたは商品情報を調べる係です。渡された商品名・品番を Web 検索し、公式サイトや信頼できる販売サイトの情報から、次を日本語で短く（200字以内）まとめてください。
- 商品名（ブランド）と色名・色番号
- 色の説明（何系の色か、黄み／青み、明るさ・くすみ具合）
- コスメなら質感・仕上がり（ツヤ・マット・シアー・ラメなど）、服なら素材・生地の厚み・シルエット・丈
商品を特定できないときは「特定できませんでした」とだけ書く。推測で埋めない。候補が複数あるときは、いちばん当てはまるものと、その理由を一言。`;
// 品番から商品情報を調べる。検索に渡すのは品番（商品名）だけ
async function searchProduct(product, mode) {
  let messages = [{ role: "user", content: `種類: ${mode.label}\n商品名・品番: ${product}` }];
  for (let i = 0; i < 4; i++) {
    const res = await createMessage({
      model: settings.model,
      max_tokens: 4000,
      fallbacks: "default",
      output_config: { effort: "low" },
      system: SEARCH_SYSTEM,
      tools: [{ type: "web_search_20260209", name: "web_search", max_uses: 3 }],
      messages,
    });
    recordUsage(settings.model, res.usage);
    if (res.stop_reason === "pause_turn") { messages = [...messages, { role: "assistant", content: res.content }]; continue; }
    if (res.stop_reason === "refusal") return "特定できませんでした";
    const text = res.content.filter(b => b.type === "text").map(b => b.text).join("").trim();
    return text || "特定できませんでした";
  }
  return "特定できませんでした";
}
async function callClaude(messages) {
  const res = await createMessage({
    model: settings.model,
    max_tokens: 16000,
    fallbacks: "default",
    thinking: { type: "adaptive" },
    output_config: { effort: settings.effort, format: { type: "json_schema", schema: RESULT_SCHEMA } },
    system: [
      { type: "text", text: SYSTEM_BASE },
      { type: "text", text: `# 本人の診断ルール\n\n${profile.aiText.style}\n\n# 本人のメイクレッスン\n\n${profile.aiText.makeup}`, cache_control: { type: "ephemeral" } },
    ],
    messages,
  });
  recordUsage(settings.model, res.usage);
  if (res.stop_reason === "refusal") throw new Error("AIがこの内容には答えられませんでした。写真を変えて試してください。");
  if (res.stop_reason === "max_tokens") throw new Error("答えが長くなりすぎて途中で切れました。もう一度試してください。");
  const text = [...res.content].reverse().find(b => b.type === "text")?.text;
  if (!text) throw new Error("答えを受け取れませんでした");
  return { result: JSON.parse(text), raw: text };
}
function firstMessage(conv) {
  const mode = MODES.find(m => m.id === conv.mode);
  const content = [];
  conv.images.forEach(img => {
    content.push({ type: "text", text: `【${img.label}】` });
    content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: img.data.split(",")[1] } });
  });
  let text = `判定の種類: ${mode.label}\n`;
  if (conv.product) text += `商品名・品番: ${conv.product}\n調べた商品情報: ${conv.productInfo || "特定できませんでした"}\n`;
  if (!conv.images.length) text += "写真はありません。商品情報だけで判定してください。\n";
  if (conv.note) text += `本人のメモ: ${conv.note}\n`;
  if (mode.shopping) text += `買うか迷っている: ${conv.shopping ? "はい" : "いいえ"}\n`;
  if (conv.selfCheck?.length) text += `本人がセルフチェックで ✓ した項目: ${conv.selfCheck.join("／")}\n`;
  if (conv.facts?.length) text += `本人が伝えた情報（写真より優先する事実）: ${conv.facts.join("／")}\n`;
  if (conv.picked) text += `本人が写真をタップして取った色（アプリが数値で計算。色については写真の見え方より最優先）: ${conv.picked.hex}、${conv.picked.name}系${conv.picked.traits.length ? "、" + conv.picked.traits.join("・") : ""}${conv.picked.near ? `、色見本の「${conv.picked.near.name}」に近い` : "、13色の色見本とは離れている"}\n`;
  content.push({ type: "text", text });
  return { role: "user", content };
}
function conversationMessages(conv) {
  const msgs = [firstMessage(conv)];
  conv.turns.forEach((t, k) => {
    if (k > 0) msgs.push({ role: "user", content: t.question });
    if (t.raw) msgs.push({ role: "assistant", content: t.raw });
  });
  return msgs;
}
setInterval(() => { const e = $("#elapsed"); if (e && judgeState.busy) e.textContent = Math.round((Date.now() - judgeState.startedAt) / 1000) + "秒"; }, 1000);
async function startJudge() {
  const mode = MODES.find(m => m.id === judgeState.mode);
  const images = [];
  mode.slots.forEach((s, k) => (judgeState.photos[k] || []).forEach(p => images.push({ label: s.label, data: p.full, thumb: p.thumb })));
  const product = mode.product ? judgeState.product.trim() : "";
  if (!images.length && !product) { judgeState.error = mode.product ? "写真か商品名・品番のどちらかを入れてください" : "写真を1枚以上入れてください"; return renderAi(); }
  const conv = {
    id: String(Date.now()), at: Date.now(), mode: mode.id, note: judgeState.note.trim(), shopping: mode.shopping && judgeState.shopping, product, productInfo: "",
    picked: mode.id !== "face" ? pickedColor() : null,
    selfCheck: mode.id === "face" ? [...mkChecked] : [], facts: FACTS.filter(f => f.modes.includes(mode.id) && judgeState.facts[f.id]).map(f => `${f.label}: ${judgeState.facts[f.id]}`), images, thumbs: images.map(i => i.thumb), turns: [],
  };
  judgeState.busy = true; judgeState.error = ""; judgeState.startedAt = Date.now();
  judgeState.stage = product ? "search" : "judge"; renderAi();
  try {
    if (product) {
      conv.productInfo = await searchProduct(product, mode);
      judgeState.stage = "judge"; renderAi();
    }
    const { result, raw } = await callClaude(conversationMessages(conv));
    conv.turns.push({ result, raw });
    judgeState.current = conv; judgeState.note = ""; judgeState.shopping = false; judgeState.product = ""; judgeState.picker = null; judgeState.picked = null; judgeState.white = null;
    await saveHistory(conv);
  } catch (e) { judgeState.error = errorText(e); }
  judgeState.busy = false; judgeState.stage = ""; renderJudge();
}
async function followUp(q) {
  const conv = judgeState.current;
  judgeState.busy = true; judgeState.error = ""; judgeState.startedAt = Date.now(); renderAi();
  try {
    const turn = { question: q };
    const { result, raw } = await callClaude([...conversationMessages(conv), { role: "user", content: q }]);
    Object.assign(turn, { result, raw });
    conv.turns.push(turn);
    await saveHistory(conv);
  } catch (e) { judgeState.error = errorText(e); }
  judgeState.busy = false; renderJudge();
}
async function saveHistory(conv) {
  const { images, ...rest } = conv; // 送った大きい写真は保存しない（小さい写真だけ）
  await idb.put(rest);
}
async function renderHistory() {
  const el = $("#hist"); if (!el) return;
  const all = await idb.all();
  if (!all.length) { el.innerHTML = `<div class="empty">${EMPTY_ART}<p class="muted">AIに見てもらうと、ここに<br>直近${HISTORY_MAX}件が残ります</p></div>`; return; }
  el.innerHTML = all.map(h => {
    const r = h.turns[h.turns.length - 1]?.result;
    const d = new Date(h.at);
    return `<button class="hist" data-h="${esc(h.id)}">${h.thumbs[0] ? `<img src="${h.thumbs[0]}" alt="">` : `<span class="ph"></span>`}<span class="t"><b>${r ? esc(r.headline) : "結果なし"}</b><span class="muted">${d.getMonth() + 1}/${d.getDate()}・${esc(MODES.find(m => m.id === h.mode)?.label || "")}</span></span>${r ? grade(r.overall) : ""}</button><div id="hd-${esc(h.id)}" hidden></div>`;
  }).join("");
  el.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    const box = $("#hd-" + CSS.escape(b.dataset.h));
    if (!box.hidden) { box.hidden = true; return; }
    box.innerHTML = renderConversation(all.find(h => h.id === b.dataset.h), false);
    box.hidden = false;
  });
}

// 新しい版が公開されていたら知らせる（スマホが古い版を覚えていても更新できるように）
async function checkUpdate() {
  try {
    const html = await (await fetch(location.pathname, { cache: "no-store" })).text();
    const latest = html.match(/const APP_VERSION = "([^"]+)"/)?.[1];
    if (!latest || latest === APP_VERSION) return;
    const el = $("#update");
    el.hidden = false;
    el.innerHTML = `<div class="notice" style="display:flex;align-items:center;gap:10px;margin:0 0 12px">${icon("sparkle")}<span style="flex:1">新しい版があります</span><button class="btn primary" id="doUpdate" style="min-height:38px">更新する</button></div>`;
    $("#doUpdate").onclick = () => location.replace(`${location.pathname}?v=${encodeURIComponent(latest)}`);
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
applyTheme();
checkUpdate();
try { navigator.storage?.persist?.(); } catch {}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
renderAll();
